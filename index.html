<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cymor 4K | Ultra-Realistic AI Enhancer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-glow blue"></div>
    <div class="bg-glow purple"></div>

    <main class="app-container">
        <header class="main-header">
            <div class="logo">CYMOR<span>4K</span> <span class="badge">4K ULTRA</span></div>
            <p class="subtitle">AI Video Super-Resolution for Professional Editors</p>
        </header>

        <section class="dashboard-grid">
            <div class="glass-panel control-panel">
                <div class="drop-zone" id="dropZone">
                    <input type="file" id="fileInput" accept="video/*" hidden>
                    <div class="drop-icon">⚡</div>
                    <h3>Upload Source</h3>
                    <button class="btn-primary" onclick="document.getElementById('fileInput').click()">Select Video</button>
                </div>

                <div class="settings-box disabled" id="settingsBox">
                    <div class="meta-row">
                        <span id="fileName">video.mp4</span>
                        <span id="fileSize">0.0 MB</span>
                    </div>

                    <div class="control-group">
                        <label>AI Model</label>
                        <select id="modelSelect">
                            <option value="ultra">Cymor Ultra-Realism v3 (Cinematic)</option>
                            <option value="anime">Studio Ghibli Sharpener</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>Target Resolution</label>
                        <div class="radio-tile-group">
                            <label class="radio-tile">
                                <input type="radio" name="res" value="4k" checked>
                                <span>4K Ultra HD</span>
                            </label>
                        </div>
                    </div>

                    <button class="btn-action dynamic-glow" id="startBtn">Initialize WebGPU Render</button>
                    
                    <div id="downloadContainer" class="hidden">
                        <button class="btn-download" id="downloadBtn">
                            <span>⬇</span> Download Enhanced 4K
                        </button>
                    </div>
                </div>
            </div>

            <div class="glass-panel preview-panel">
                <div class="preview-wrapper">
                    <div class="comparison-slider" id="sliderContainer">
                        <video id="processedVideo" class="video-after" muted loop playsinline></video>
                        <div class="video-before-wrapper" id="beforeWrapper">
                            <video id="sourceVideo" class="video-before" muted loop playsinline></video>
                        </div>
                        <div class="slider-handle" id="sliderHandle"></div>
                        
                        <span class="view-badge before-badge">Original</span>
                        <span class="view-badge after-badge">Cymor AI 4K</span>
                    </div>

                    <div class="processing-overlay hidden" id="processingOverlay">
                        <div class="spinner"></div>
                        <h3 id="statusText">Optimizing Textures...</h3>
                        <div class="progress-container">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <span class="progress-percent" id="progressPercent">0%</span>
                    </div>
                </div>

                <div class="metrics-bar">
                    <div class="metric"><span class="label">Engine:</span> <span class="val native">WebGPU</span></div>
                    <div class="metric"><span class="label">Server Cost:</span> <span class="val free">$0.00</span></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">Site made by the Legendary Smiley Cymor</footer>

    <script src="script.js"></script>
</body>
</html>
